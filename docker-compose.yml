version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: epms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: EPMS
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/epms_schema.sql:/docker-entrypoint-initdb.d/epms_schema.sql

volumes:
  mysql_data: